[package]
name = "enigma-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "Static Enigma unpacker"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cuda", "wgpu"]
cuda = ["dep:cubecl", "dep:cubecl-cuda", "dep:cudarc"]
wgpu = ["dep:cubecl", "dep:cubecl-wgpu", "dep:wgpu", "dep:getrandom", "dep:cubecl-common", "dep:serde_json"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
cubecl = { package = "cubecl-core", version = "=0.10.0", default-features = false, features = ["std"], optional = true }
cubecl-cuda = { version = "=0.10.0", default-features = false, features = ["std"], optional = true }
cudarc = { version = "=0.19.10", default-features = false, features = ["cuda-13040", "dynamic-loading"], optional = true }
cubecl-wgpu = { version = "=0.10.0", default-features = false, features = ["std"], optional = true }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "instr_info", "code_asm", "intel"] }
md5 = "0.8"
rustc-hash = "2.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
indicatif = { version = "0.18", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cubecl-common = { version = "=0.10.0", default-features = false, features = ["std", "hash", "serde"], optional = true }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
serde_json = { version = "1", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "29", default-features = false, features = ["webgpu", "wgsl"], optional = true }
web-time = "1"
zip = { version = "2", default-features = false }

[dev-dependencies]
sha2 = "0.10"
zip = { version = "2", default-features = false }

[build-dependencies]
anyhow = "1"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
